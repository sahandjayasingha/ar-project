<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Project Exhibit</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
        #status-banner {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            color: #ffffff;
            background-color: #d9534f;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            z-index: 9999;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="status-banner">Searching for Hiro Marker...</div>

    <script>
        AFRAME.registerComponent('ar-click-system', {
            init: function () {
                var sceneEl = this.el;
                var colors = ['#EF2D5E', '#4CC3D9', '#FFC65D', '#7BC8A4', '#9B59B6', '#FF9800'];
                var isExpanded = false;

                function handlePointer(clientX, clientY) {
                    var camera = sceneEl.camera;
                    if (!camera) return;

                    var mouse = new THREE.Vector2();
                    mouse.x = (clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(clientY / window.innerHeight) * 2 + 1;

                    var raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(mouse, camera);

                    var clickableEls = sceneEl.querySelectorAll('.clickable');
                    var meshes = [];
                    clickableEls.forEach(function (el) {
                        if (el.object3D) {
                            meshes.push(el.object3D);
                        }
                    });

                    var intersects = raycaster.intersectObjects(meshes, true);

                    if (intersects.length > 0) {
                        var hitMesh = intersects[0].object;
                        var hitEl = hitMesh.el;

                        while (!hitEl && hitMesh.parent) {
                            hitMesh = hitMesh.parent;
                            hitEl = hitMesh.el;
                        }

                        if (hitEl) {
                            if (hitEl.id === 'interactive-ball') {
                                var nextColor = colors[Math.floor(Math.random() * colors.length)];
                                hitEl.setAttribute('material', 'color', nextColor);
                            } else if (hitEl.id === 'interactive-box') {
                                isExpanded = !isExpanded;
                                if (isExpanded) {
                                    hitEl.setAttribute('scale', '0.28 0.28 0.28');
                                } else {
                                    hitEl.setAttribute('scale', '0.18 0.18 0.18');
                                }
                            }
                        }
                    }
                }

                window.addEventListener('click', function (e) {
                    handlePointer(e.clientX, e.clientY);
                });

                window.addEventListener('touchstart', function (e) {
                    if (e.touches.length > 0) {
                        handlePointer(e.touches[0].clientX, e.touches[0].clientY);
                    }
                });
            }
        });
    </script>

    <a-scene embedded
             vr-mode-ui="enabled: false"
             arjs="sourceType: webcam; debugUIEnabled: false;"
             ar-click-system>

        <a-assets>
            <a-asset-item id="houseModel" src="assets/house.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro" id="hiro-marker">
            <a-entity gltf-model="#houseModel"
                      position="0 0.1 0"
                      scale="0.25 0.25 0.25"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear">
            </a-entity>

            <a-box id="interactive-box"
                   position="-0.45 0.2 0"
                   scale="0.18 0.18 0.18"
                   material="color: #4CC3D9;"
                   class="clickable">
            </a-box>

            <a-sphere id="interactive-ball"
                      position="0.45 0.2 0"
                      radius="0.1"
                      material="color: #EF2D5E;"
                      class="clickable"
                      animation="property: position; to: 0.45 0.45 0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine">
            </a-sphere>

            <a-text value="Mini House Exhibit"
                    position="0 0.75 0"
                    align="center"
                    color="#FFFFFF"
                    scale="0.5 0.5 0.5">
            </a-text>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        var marker = document.querySelector('#hiro-marker');
        var banner = document.getElementById('status-banner');

        marker.addEventListener('markerFound', function () {
            banner.textContent = 'Hiro Marker Found!';
            banner.style.backgroundColor = '#5cb85c';
        });

        marker.addEventListener('markerLost', function () {
            banner.textContent = 'Searching for Hiro Marker...';
            banner.style.backgroundColor = '#d9534f';
        });
    </script>
</body>
</html>
