<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Miniature House Exhibit</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
   
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        #status-banner {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 22px;
            color: #ffffff;
            background-color: #d9534f; 
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

<div id="status-banner">Searching for Hiro Marker...</div>

    
 <script>

    AFRAME.registerComponent('ball-color-changer', {
        init: function () {
            const colors = ['#EF2D5E', '#4CC3D9', '#FFC65D', '#7BC8A4', '#9B59B6'];
            this.el.addEventListener('click', () => {
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                this.el.setAttribute('material', 'color', randomColor);
            });
            }
        });


     AFRAME.registerComponent('grow-toggle', {
        init: function () {
            let isGrown = false;
            this.el.addEventListener('click', () => {
                isGrown = !isGrown;
                if (isGrown) {
                    this.el.setAttribute('scale', '0.5 0.5 0.5');
                } else {
                    this.el.setAttribute('scale', '0.3 0.3 0.3');
                }
                });
            }
        });
    </script>

    <a-scene embedded
             vr-mode-ui="enabled: false"
             arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>

        <a-asset-item id="houseModel" src="assets/house.glb"></a-asset-item>
        </a-assets>

    <a-marker preset="hiro" id="hiro-marker">

        <a-entity gltf-model="#houseModel"
                      position="0 0.1 0"
                      scale="0.35 0.35 0.35"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear">
        </a-entity>

        <a-box position="-0.75 0.3 0"
                   scale="0.3 0.3 0.3"
                   material="color: #4CC3D9;"
                   class="clickable"
                   grow-toggle>
        </a-box>


        <a-sphere position="0.75 0.3 0"
                      radius="0.18"
                      material="color: #EF2D5E;"
                      class="clickable"
                      ball-color-changer
                      animation="property: position; to: 0.75 0.75 0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine">
        </a-sphere>

        <a-text value="Mini House Exhibit"
                    position="0 1.2 0"
                    align="center"
                    color="#FFFFFF"
                    scale="1.2 1.2 1.2">
        </a-text>

        </a-marker>

        <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>


    <script>
        const marker = document.querySelector('#hiro-marker');
        const banner = document.getElementById('status-banner');

        marker.addEventListener('markerFound', () => {
            banner.textContent = 'Hiro Marker Found!';
            banner.style.backgroundColor = '#5cb85c'; // Green
        });

        marker.addEventListener('markerLost', () => {
            banner.textContent = 'Searching for Hiro Marker...';
            banner.style.backgroundColor = '#d9534f'; 
        });
    </script>
</body>
</html>
