<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Project Exhibit</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
        #status-banner {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            color: #ffffff;
            background-color: #d9534f;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            z-index: 9999;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="status-banner">Searching for Hiro Marker...</div>

    <script>
        AFRAME.registerComponent('ball-color-changer', {
            init: function () {
                var el = this.el;
                var colors = ['#EF2D5E', '#4CC3D9', '#FFC65D', '#7BC8A4', '#9B59B6', '#FF9800'];
                
                function triggerColorChange(evt) {
                    if (evt) evt.stopPropagation();
                    var randomColor = colors[Math.floor(Math.random() * colors.length)];
                    el.setAttribute('material', 'color', randomColor);
                }

                el.addEventListener('click', triggerColorChange);
                el.addEventListener('mousedown', triggerColorChange);
                el.addEventListener('touchstart', triggerColorChange);
            }
        });

        AFRAME.registerComponent('grow-toggle', {
            init: function () {
                var el = this.el;
                var isExpanded = false;

                function triggerScaleToggle(evt) {
                    if (evt) evt.stopPropagation();
                    isExpanded = !isExpanded;
                    if (isExpanded) {
                        el.setAttribute('scale', '0.28 0.28 0.28');
                    } else {
                        el.setAttribute('scale', '0.18 0.18 0.18');
                    }
                }

                el.addEventListener('click', triggerScaleToggle);
                el.addEventListener('mousedown', triggerScaleToggle);
                el.addEventListener('touchstart', triggerScaleToggle);
            }
        });
    </script>

    <a-scene embedded
             vr-mode-ui="enabled: false"
             arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <a-asset-item id="houseModel" src="assets/house.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro" id="hiro-marker" emitevents="true" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
            <a-entity gltf-model="#houseModel"
                      position="0 0.1 0"
                      scale="0.25 0.25 0.25"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear">
            </a-entity>

            <a-box position="-0.45 0.2 0"
                   scale="0.18 0.18 0.18"
                   material="color: #4CC3D9;"
                   class="clickable"
                   grow-toggle>
            </a-box>

            <a-sphere position="0.45 0.2 0"
                      radius="0.1"
                      material="color: #EF2D5E;"
                      class="clickable"
                      ball-color-changer
                      animation="property: position; to: 0.45 0.45 0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine">
            </a-sphere>

            <a-text value="Mini House Exhibit"
                    position="0 0.75 0"
                    align="center"
                    color="#FFFFFF"
                    scale="0.5 0.5 0.5">
            </a-text>
        </a-marker>

        <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>

    <script>
        var marker = document.querySelector('#hiro-marker');
        var banner = document.getElementById('status-banner');

        marker.addEventListener('markerFound', function () {
            banner.textContent = 'Hiro Marker Found!';
            banner.style.backgroundColor = '#5cb85c';
        });

        marker.addEventListener('markerLost', function () {
            banner.textContent = 'Searching for Hiro Marker...';
            banner.style.backgroundColor = '#d9534f';
        });
    </script>
</body>
</html>
